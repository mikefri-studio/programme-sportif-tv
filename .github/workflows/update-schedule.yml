name: Mettre à jour le programme TV (via API)

on:
  schedule:
    - cron: '0 6,18 * * *' # S'exécute à 06h00 et 18h00 (2 fois/jour pour économiser le quota API)
  workflow_dispatch: # Permet de le lancer manuellement

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        
      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Installer les dépendances
        run: pip install requests
        
      - name: Lancer le script de récupération API
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }} # Injection sécurisée de la clé
        run: python fetch_api.py
        
      - name: Commit et push des modifications
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/schedule.json
          git commit -m "chore: mise à jour du programme TV via API" || exit 0
          git push

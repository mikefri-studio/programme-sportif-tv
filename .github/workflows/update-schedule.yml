name: Mettre à jour le programme TV multisports

on:
  schedule:
    - cron: '0 7,19 * * *'  # 2 fois/jour (07h00 et 19h00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        
      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Installer les dépendances
        run: pip install requests
        
      - name: Lancer le script multisports
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_RUGBY_KEY: ${{ secrets.API_RUGBY_KEY }}
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
          API_CYCLING_KEY: ${{ secrets.API_CYCLING_KEY }}
        run: python fetch_api.py
        
      - name: Commit et push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/schedule.json
          git commit -m "chore: mise à jour programme multisports (foot, rugby, tennis, vélo)" || exit 0
          git push

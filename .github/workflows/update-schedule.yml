name: Mettre à jour le programme TV (TheSportsDB)

on:
  schedule:
    - cron: '0 8,18 * * *'  # 2 fois par jour (08h00 et 18h00)
  workflow_dispatch:        # Pour lancer manuellement

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        
      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Installer les dépendances
        run: pip install requests
        
      - name: Lancer le script TheSportsDB
        env:
          # Optionnel : tu peux ajouter cette clé dans tes secrets GitHub, 
          # sinon le script utilisera la clé publique "3" par défaut.
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
        run: python fetch_api.py
        
      - name: Commit et push des modifications
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/schedule.json
          git commit -m "chore: mise à jour programme TV via TheSportsDB" || exit 0
          git push

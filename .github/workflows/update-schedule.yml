name: Mettre à jour le programme TV

on:
  schedule:
    - cron: '0 8,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - run: pip install requests beautifulsoup4
      
      - name: Scraper tv-sports.fr + TheSportsDB
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: python fetch_api.py
        
      - run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/schedule.json
          git commit -m "chore: mise à jour programme TV" || exit 0
          git push

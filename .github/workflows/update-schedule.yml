name: Mettre à jour le programme TV

on:
  schedule:
    - cron: '0 * * * *' # S'exécute toutes les heures (à 00 min)
  workflow_dispatch: # Permet de le lancer manuellement depuis l'onglet "Actions"

permissions:
  contents: write # Nécessaire pour pousser les modifications

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        
      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Installer les dépendances
        run: pip install beautifulsoup4 requests
        
      - name: Lancer le script de scraping
        run: python scrape.py
        
      - name: Commit et push des modifications
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/schedule.json
          git commit -m "chore: mise à jour automatique du programme TV" || exit 0
          git push

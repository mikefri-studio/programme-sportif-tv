<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
 <base href="/programme-sportif-tv/">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SportTV">
<meta name="description" content="Programme sportif TV en direct et à venir, chaîne par chaîne">
<title>SportTV · Programme sportif par chaîne</title>
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
 <link rel="manifest" href="./manifest.json">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
  .mono { font-family: 'JetBrains Mono', monospace; }

  body { background: #f4f5f9; min-height: 100vh; color: #1a202c; }

  .top-bar { background: #fff; border-bottom: 1px solid #e2e8f0; }

  .nav-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 999px;
    font-size: 14px; font-weight: 600; color: #475569;
    background: #fff; border: 1px solid #e2e8f0;
    cursor: pointer; transition: all .15s ease; white-space: nowrap;
  }
  .nav-pill:hover { background: #f1f5f9; border-color: #cbd5e1; }
  .nav-pill.active { background: #1e293b; color: #fff; border-color: #1e293b; }
  .nav-pill.live { background: #ef4444; color: #fff; border-color: #ef4444; }
  .nav-pill.live:hover { background: #dc2626; }

  .select-ctrl {
    appearance: none; -webkit-appearance: none;
    background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
    padding: 10px 36px 10px 36px; font-size: 14px; font-weight: 600; color: #334155;
    cursor: pointer; outline: none; transition: border-color .15s, box-shadow .15s;
    min-width: 180px;
  }
  .select-ctrl:hover { border-color: #94a3b8; }
  .select-ctrl:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }

  .date-bar {
    background: linear-gradient(90deg, #e2e8f0 0%, #f1f5f9 100%);
    border-radius: 8px; padding: 10px 16px;
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px;
  }
  .date-bar .date-label { font-weight: 700; color: #1e293b; font-size: 15px; }
  .date-bar .date-count { font-size: 13px; color: #64748b; font-weight: 600; }

  .channel-card {
    background: #fff; border-radius: 14px; border: 1px solid #e2e8f0;
    overflow: hidden; position: relative;
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .channel-card:hover {
    transform: translateY(-4px);
    border-color: rgba(59,130,246,.4);
    box-shadow: 0 20px 40px -12px rgba(0,0,0,.12), 0 0 0 1px rgba(59,130,246,.1);
  }

  .channel-header {
    background: linear-gradient(135deg, #1e293b 0%, #334155 50%, #1e293b 100%);
    background-size: 200% 200%;
    padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    color: #fff; position: relative; overflow: hidden;
    transition: background-position .5s ease;
  }
  .channel-header::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,.12) 0%, rgba(255,255,255,0) 100%);
    pointer-events: none;
  }
  .channel-card:hover .channel-header { background-position: 100% 100%; }

  .channel-logo {
    width: 48px; height: 48px; object-fit: contain;
    background: #fff; border-radius: 10px; padding: 6px;
    box-shadow: 0 4px 12px rgba(0,0,0,.2);
    position: relative; z-index: 1; transition: transform .25s ease;
    flex-shrink: 0;
  }
  .channel-card:hover .channel-logo { transform: scale(1.05); }

  .channel-name { font-weight: 800; font-size: 17px; letter-spacing: -0.01em; position: relative; z-index: 1; }
  .channel-count { font-size: 12px; opacity: .75; font-weight: 500; position: relative; z-index: 1; }

  .watch-btn {
    background: rgba(255,255,255,0.15); 
    backdrop-filter: blur(4px);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff; 
    font-size: 12px; 
    font-weight: 700; 
    padding: 8px 14px; 
    border-radius: 8px; 
    display: flex; 
    align-items: center; 
    gap: 6px;
    cursor: pointer; 
    transition: all .2s ease;
    position: relative;
    z-index: 2;
    white-space: nowrap;
  }
  .watch-btn:hover { 
    background: #ef4444; 
    border-color: #ef4444; 
    transform: scale(1.05);
    box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
  }

  .match-row {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 20px; border-bottom: 1px solid #f1f5f9;
    transition: background .15s ease; cursor: pointer; position: relative;
  }
  .match-row:last-child { border-bottom: none; }
  .match-row:hover { background: linear-gradient(90deg, #f8fafc 0%, #fff 100%); }
  .match-row:active { background: #f1f5f9; }

  .match-time {
    font-family: 'JetBrains Mono', monospace; font-weight: 700;
    font-size: 16px; color: #1e293b; min-width: 52px; text-align: center;
  }
  .match-time .live-badge {
    display: block; font-family: 'Inter', sans-serif;
    font-size: 9px; font-weight: 700; color: #ef4444;
    letter-spacing: .05em; margin-top: 2px;
  }

  .match-info { flex: 1; min-width: 0; }
  .match-sport { font-size: 11px; color: #64748b; font-weight: 500; margin-bottom: 2px; }
  .match-title {
    font-weight: 700; font-size: 15px; color: #1e293b;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .match-comp { font-size: 11px; color: #94a3b8; margin-top: 2px; }

  .live-strip {
    background: linear-gradient(90deg, #fef2f2 0%, #fff 100%);
    border: 1px solid #fecaca; border-radius: 12px; padding: 16px; margin-bottom: 24px;
  }
  .live-card {
    background: #fff; border: 1px solid #fecaca; border-left: 4px solid #ef4444;
    border-radius: 10px; padding: 12px 16px; min-width: 280px;
    transition: transform .15s ease, box-shadow .15s ease;
    position: relative; overflow: hidden;
  }
  .live-card.clickable { cursor: pointer; }
  .live-card.clickable:hover { transform: translateY(-2px); box-shadow: 0 8px 20px -8px rgba(239,68,68,.3); }
  .live-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 40%;
    background: linear-gradient(180deg, rgba(254,202,202,.3) 0%, rgba(254,202,202,0) 100%);
    pointer-events: none;
  }

  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,.5); backdrop-filter: blur(4px);
    z-index: 100; display: flex; align-items: center; justify-content: center;
    padding: 20px; opacity: 0; pointer-events: none; transition: opacity .2s ease;
  }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }
  .modal-content {
    background: #fff; border-radius: 16px; max-width: 500px; width: 100%;
    max-height: 90vh; overflow-y: auto; box-shadow: 0 24px 48px rgba(0,0,0,.2);
    transform: scale(.95); transition: transform .2s ease;
  }
  .modal-overlay.active .modal-content { transform: scale(1); }
  .modal-header {
    background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
    padding: 24px; color: #fff; position: relative;
  }
  .modal-close {
    position: absolute; top: 16px; right: 16px;
    width: 32px; height: 32px; background: rgba(255,255,255,.2);
    border: none; border-radius: 8px; color: #fff; font-size: 20px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background .15s ease;
  }
  .modal-close:hover { background: rgba(255,255,255,.3); }
  .modal-body { padding: 24px; }
  .modal-info-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0; border-bottom: 1px solid #f1f5f9;
  }
  .modal-info-row:last-child { border-bottom: none; }
  .modal-info-icon {
    width: 40px; height: 40px; background: #f1f5f9; border-radius: 10px;
    display: flex; align-items: center; justify-content: center; font-size: 20px;
    flex-shrink: 0;
  }
  .modal-info-label { font-size: 12px; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .modal-info-value { font-size: 15px; color: #1e293b; font-weight: 600; margin-top: 2px; }

  .install-banner {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #1e293b; color: #fff; padding: 12px 20px; border-radius: 999px;
    box-shadow: 0 10px 30px rgba(0,0,0,.2); display: flex; align-items: center; gap: 12px;
    z-index: 200; opacity: 0; pointer-events: none; transition: opacity .3s ease;
  }
  .install-banner.show { opacity: 1; pointer-events: auto; }

  ::-webkit-scrollbar { height: 8px; width: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  .live-strip-scroll::-webkit-scrollbar { height: 6px; }

  @keyframes pulseDot { 0%,100% { opacity:1; transform:scale(1);} 50% { opacity:.4; transform:scale(.75);} }
  .live-dot { animation: pulseDot 1.2s ease-in-out infinite; display: inline-block; }

  @keyframes fadeUp { from { opacity:0; transform: translateY(12px);} to { opacity:1; transform:none;} }
  .fade-up { animation: fadeUp .4s ease both; }
</style>
</head>
<body>

<header class="top-bar sticky top-0 z-50">
  <div class="w-full px-4 md:px-6 lg:px-8 py-3 flex items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-red-500 to-red-600 flex items-center justify-center text-white font-black text-xs shadow-sm">TV</div>
        <div class="flex items-baseline gap-0.5">
          <span class="text-xl font-black text-slate-900 tracking-tight">SPORTS</span>
          <span class="text-xs font-bold text-red-500">2H</span>

    <nav class="hidden lg:flex items-center gap-2">

      <button class="nav-pill active" data-sport="all">Tous</button>

    <div class="flex items-center gap-3">
      <div class="hidden md:flex items-center gap-2 text-xs text-slate-500 bg-slate-100 rounded-full px-3 py-1.5">
        <span class="w-2 h-2 rounded-full bg-emerald-500 live-dot"></span>
        <span id="update-text">Chargement…</span>
      </div>
      <button class="lg:hidden p-2 rounded-lg hover:bg-slate-100" id="mobile-menu-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>

  <div class="lg:hidden px-4 pb-3 flex flex-wrap gap-2" id="mobile-nav">

    <button class="nav-pill" data-sport="Football">⚽ Foot</button>
    <button class="nav-pill" data-sport="Rugby">🏉 Rugby</button>
    <button class="nav-pill" data-sport="Tennis">🎾 Tennis</button>

<main class="w-full px-4 md:px-6 lg:px-8 py-6 pb-20">

  <section id="live-section" class="hidden mb-6">

  <section class="mb-6">

      <div class="relative flex-1 min-w-[220px]">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">🔍</span>
        <input id="search" type="text" placeholder="Rechercher un match, une compétition, une chaîne…"
               class="w-full bg-slate-50 border border-slate-200 rounded-lg pl-10 pr-4 py-2.5 text-sm outline-none focus:border-blue-500 focus:bg-white transition placeholder:text-slate-400">
      </div>
      <div class="relative">
        <select id="date-select" class="select-ctrl w-full lg:w-auto">
          <option value="all">Toutes les dates</option>

          <option value="all">Toutes les chaînes</option>

  <section id="channels" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-4"></section>

<div id="modal" class="modal-overlay">

</div>

<div id="install-banner" class="install-banner">
  <span class="text-sm font-semibold">📲 Installer l'application</span>

<footer class="border-t border-slate-200 py-6 text-center text-xs text-slate-400 bg-white">
  Données : tv-sports.fr · Mise à jour automatique via GitHub Actions · Fait avec ❤️
</footer>

<script>
const SPORT_EMOJI = {
  'Football':'⚽','Rugby':'🏉','Tennis':'🎾','Cyclisme':'🚴','Basket-ball':'🏀',
  'Formule 1':'🏎️','Handball':'🤾','Moto':'🏍️','Multisports':'🏅'
};
const emoji = s => SPORT_EMOJI[s] || '';

// ✅ NOUVEAU : Durées typiques des émissions (en minutes) pour savoir quand un direct est TERMINÉ
const SPORT_DURATION_MIN = {
  'Football': 115,      // match + mi-temps
  'Rugby': 110,
  'Basket-ball': 110,
  'Handball': 110,
  'Tennis': 200,        // session pouvant aller jusqu'à ~3h20
  'Cyclisme': 300,
  'Formule 1': 120,
  'Moto': 120,
  'Multisports': 150,
};
const DEFAULT_DURATION_MIN = 120;

let DATA = null;
let CHANNELS_DATA = null;
let LIVE_INDEX = null; // ✅ index des horaires par chaîne/date pour calculer la fin d'un direct
const state = { search:'', sport:'all', liveOnly:false, date:'all', channel:'all' };

function findLogoFromChannels(channelName) {
  if (!CHANNELS_DATA) return '';
  const normalizedChannel = channelName.toLowerCase().trim();
  const found = CHANNELS_DATA.find(ch => {
    const chName = ch.name.toLowerCase().trim();
    return chName === normalizedChannel || normalizedChannel.includes(chName) || chName.includes(normalizedChannel);
  });
  return found?.logo || '';
}

function getChannelUrl(channelName) {
  if (!CHANNELS_DATA) return null;
  const normalizedChannel = channelName.toLowerCase().trim();
  const found = CHANNELS_DATA.find(ch => {
    const chName = ch.name.toLowerCase().trim();
    return chName === normalizedChannel || normalizedChannel.includes(chName) || chName.includes(normalizedChannel);
  });
  return found?.url || null;
}

function getChannelLogo(channelName) {
  const localLogo = DATA?.channels?.[channelName]?.logo;
  if (localLogo) return localLogo;
  return findLogoFromChannels(channelName);
}

function openPlayer(url, channel, logo, sport) {
  const params = new URLSearchParams({
    url: url,
    channel: channel || '',
    logo: logo || '',
    sport: sport || '',
    autoplay: '1'
  });
  window.open(`player.html?${params.toString()}`, '_blank', 'noopener,noreferrer');
}

function parseMatchTime(dateStr, timeStr) {
  const match = String(timeStr).match(/(\d{1,2})h(\d{2})/);
  if (!match) return null;
  const hours = parseInt(match[1]);
  const minutes = parseInt(match[2]);
  const parts = dateStr.split('-');
  if (parts.length !== 3) return null;
  const year = parseInt(parts[0]);
  const month = parseInt(parts[1]);
  const day = parseInt(parts[2]);
  if (isNaN(year) || isNaN(month) || isNaN(day)) return null;
  return new Date(year, month - 1, day, hours, minutes);
}

function isMatchPast(match) {
  const matchDate = parseMatchTime(match.date, match.time);
  if (!matchDate) return false;
  return matchDate < new Date();
}

// ✅ NOUVEAU : construit l'index des horaires (par chaîne et par date)
function buildLiveIndex() {
  LIVE_INDEX = {};
  for (const [channel, data] of Object.entries(DATA?.channels || {})) {
    const byDate = {};
    for (const m of data.matches) {
      const t = parseMatchTime(m.date, m.time);
      if (!t) continue;
      (byDate[m.date] = byDate[m.date] || []).push(t.getTime());
    }
    for (const d in byDate) byDate[d].sort((a, b) => a - b);
    LIVE_INDEX[channel] = byDate;
  }
}

// ✅ NOUVEAU : heure de fin estimée = min(programme suivant sur la chaîne, durée typique du sport)
function getMatchEnd(match) {
  const start = parseMatchTime(match.date, match.time);
  if (!start) return null;
  const startMs = start.getTime();
  const dur = (SPORT_DURATION_MIN[match.sport] || DEFAULT_DURATION_MIN) * 60000;
  let end = startMs + dur;
  const times = LIVE_INDEX?.[match.channel]?.[match.date];
  if (times) {
    const next = times.find(t => t > startMs);
    if (next && next < end) end = next;
  }
  return end;
}

// ✅ CORRIGÉ : un direct = commencé ET pas encore terminé (fin estimée)
function isCurrentlyLive(match) {
  if (!match.is_live) return false;
  const start = parseMatchTime(match.date, match.time);
  if (!start) return false;
  const now = Date.now();
  const startMs = start.getTime();
  if (now < startMs) return false;          // pas encore commencé
  const end = getMatchEnd(match);
  return end !== null && now < end;          // terminé → plus "direct"
}

// ✅ NOUVEAU : minutes écoulées depuis le début du direct
function liveElapsedMin(match) {
  const start = parseMatchTime(match.date, match.time);
  if (!start) return null;
  return Math.max(0, Math.round((Date.now() - start.getTime()) / 60000));
}

function formatDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}

function formatShortDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return iso;
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((d - today) / 86400000);
  if (diff === 0) return "Aujourd'hui";
  if (diff === 1) return 'Demain';
  if (diff === -1) return 'Hier';
  return d.toLocaleDateString('fr-FR', { weekday:'short', day:'numeric', month:'short' });
}

function allMatches() {
  const list = [];
  for (const [channel, data] of Object.entries(DATA?.channels || {}))
    for (const m of data.matches) list.push({ ...m, channel });
  return list;
}

function getInitials(channel) {
  return channel.replace(/[^a-zA-ZÀ-ÿ\s+]/g,'').trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase() || 'TV';
}

function renderSelectors() {
  const dates = new Set();
  allMatches().forEach(m => { if (m.date) dates.add(m.date); });
  const dateSelect = document.getElementById('date-select');
  dateSelect.innerHTML = '<option value="all">📅 Toutes les dates</option>' +
    [...dates].sort().map(d => `<option value="${d}">📅 ${formatShortDate(d)} (${formatDate(d)})</option>`).join('');
  dateSelect.value = state.date;

  const channelSelect = document.getElementById('channel-select');
  channelSelect.innerHTML = '<option value="all">📡 Toutes les chaînes</option>' +
    Object.keys(DATA?.channels || {}).sort().map(c => `<option value="${c}">📡 ${c}</option>`).join('');
  channelSelect.value = state.channel;
}

function renderLive() {
  const seen = new Set();
  const live = allMatches()
    .filter(m => isCurrentlyLive(m) && !seen.has(m.match) && seen.add(m.match))
    .sort((a, b) => {
      // ✅ Trie du plus récemment commencé au plus ancien
      const ta = parseMatchTime(a.date, a.time)?.getTime() || 0;
      const tb = parseMatchTime(b.date, b.time)?.getTime() || 0;
      return tb - ta;
    });
  const sec = document.getElementById('live-section');
  if (!live.length) { sec.classList.add('hidden'); return; }
  sec.classList.remove('hidden');

  document.getElementById('live-strip').innerHTML = live.map(m => {
    const logo = getChannelLogo(m.channel);
    const streamUrl = getChannelUrl(m.channel);
    const elapsed = liveElapsedMin(m);
    const channelEscaped = m.channel.replace(/'/g, "\\'");
    const logoEscaped = (logo || '').replace(/'/g, "\\'");
    const sportEscaped = (m.sport || '').replace(/'/g, "\\'");
    const clickAction = streamUrl ? `onclick="openPlayer('${streamUrl}', '${channelEscaped}', '${logoEscaped}', '${sportEscaped}')"` : '';
    const clickableClass = streamUrl ? 'clickable' : '';

    return `
    <div class="live-card ${clickableClass}" ${clickAction}>
      <div class="flex items-center gap-3">
        ${logo ? `<img src="${logo}" class="w-10 h-10 object-contain bg-white rounded-lg p-1 shadow-sm flex-shrink-0" onerror="this.style.display='none'">` : ''}
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-red-500 live-dot flex-shrink-0"></span>
            <span class="text-[10px] font-bold text-red-600 uppercase tracking-wider">Direct</span>
            ${elapsed !== null ? `<span class="text-[10px] text-slate-400 font-semibold">· depuis ${elapsed} min</span>` : ''}
            <span class="text-[11px] text-slate-500 ml-auto mono font-bold">${m.time}</span>
          </div>
          <p class="font-bold text-sm text-slate-900 truncate">${m.match}</p>
          <p class="text-[11px] text-slate-500 truncate">${emoji(m.sport)} ${m.sport} · ${m.competition || ''} · ${m.channel}</p>
        </div>
      </div>
    </div>`;
  }).join('');
}

function openModal(match, channel) {
  const modal = document.getElementById('modal');
  const logo = getChannelLogo(channel);
  const streamUrl = getChannelUrl(channel);
  const initials = getInitials(channel);

  document.getElementById('modal-logo-container').innerHTML = logo
    ? `<img src="${logo}" class="w-16 h-16 object-contain bg-white rounded-xl p-2 shadow-lg">`
    : `<div class="w-16 h-16 rounded-xl bg-gradient-to-br from-slate-600 to-slate-800 flex items-center justify-center text-white font-black text-xl shadow-lg">${initials}</div>`;

  document.getElementById('modal-title').textContent = match.match;
  document.getElementById('modal-subtitle').textContent = `${emoji(match.sport)} ${match.sport} · ${match.competition || 'Compétition non renseignée'}`;

  const isLive = isCurrentlyLive(match);
  const matchDate = parseMatchTime(match.date, match.time);
  const now = new Date();
  const diffMinutes = matchDate ? Math.round((matchDate - now) / 60000) : null;
  const elapsed = liveElapsedMin(match);

  let timeStatus = '';
  if (isLive) timeStatus = `<span class="text-red-500 font-bold">● EN DIRECT${elapsed !== null ? ` · depuis ${elapsed} min` : ''}</span>`;
  else if (diffMinutes !== null && diffMinutes > 0) timeStatus = `Commence dans ${diffMinutes} min`;
  else if (diffMinutes !== null && diffMinutes < 0) timeStatus = `Terminé il y a ${Math.abs(diffMinutes)} min`;
  else timeStatus = 'Horaire à confirmer';

  const channelEscaped = channel.replace(/'/g, "\\'");
  const logoEscaped = (logo || '').replace(/'/g, "\\'");
  const sportEscaped = (match.sport || '').replace(/'/g, "\\'");

  const watchButtonHtml = streamUrl ? `
    <div class="modal-info-row">
      <div class="modal-info-icon bg-red-100 text-red-600">▶</div>
      <div class="flex-1">
        <div class="modal-info-label">Regarder</div>
        <button onclick="openPlayer('${streamUrl}', '${channelEscaped}', '${logoEscaped}', '${sportEscaped}')" class="inline-flex items-center gap-2 mt-1 bg-red-500 hover:bg-red-600 text-white text-sm font-bold px-4 py-2.5 rounded-lg transition shadow-sm cursor-pointer">
          Lancer le lecteur en direct
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        </button>
      </div>
    </div>
  ` : '';

  const scoreHtml = match.score ? `
    <div class="modal-info-row">
      <div class="modal-info-icon">📊</div>
      <div>
        <div class="modal-info-label">Score</div>
        <div class="modal-info-value text-2xl font-bold text-blue-600 mono">${match.score}</div>
      </div>
    </div>
  ` : '';

  const teamsHtml = (match.home_team || match.away_team) ? `
    <div class="modal-info-row">
      <div class="modal-info-icon">🏟️</div>
      <div>
        <div class="modal-info-label">Équipes</div>
        <div class="modal-info-value">${match.home_team || ''} ${match.away_team ? 'vs ' + match.away_team : ''}</div>
      </div>
    </div>
  ` : '';

  document.getElementById('modal-body').innerHTML = `
    ${watchButtonHtml}
    ${scoreHtml}
    ${teamsHtml}
    <div class="modal-info-row">
      <div class="modal-info-icon">🕒</div>
      <div>
        <div class="modal-info-label">Horaire</div>
        <div class="modal-info-value">${match.time} · ${formatDate(match.date)}</div>
        <div class="text-xs text-slate-500 mt-1">${timeStatus}</div>
      </div>
    </div>
    <div class="modal-info-row">
      <div class="modal-info-icon">📡</div>
      <div>
        <div class="modal-info-label">Chaîne</div>
        <div class="modal-info-value">${channel}</div>
      </div>
    </div>
    <div class="modal-info-row">
      <div class="modal-info-icon">🏆</div>
      <div>
        <div class="modal-info-label">Compétition</div>
        <div class="modal-info-value">${match.competition || 'Non renseignée'}</div>
      </div>
    </div>
    <div class="modal-info-row">
      <div class="modal-info-icon">${emoji(match.sport)}</div>
      <div>
        <div class="modal-info-label">Sport</div>
        <div class="modal-info-value">${match.sport}</div>
      </div>
    </div>
  `;

  modal.classList.add('active');
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target.id === 'modal') closeModal();
});
document.getElementById('modal-close-btn').addEventListener('click', closeModal);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

function renderChannels() {
  const q = state.search.toLowerCase();
  const container = document.getElementById('channels');
  let html = '', shown = 0, idx = 0;

  const entries = Object.entries(DATA?.channels || {})
    .filter(([ch]) => state.channel === 'all' || ch === state.channel)
    .map(([ch, data]) => [ch, data.matches.filter(m => {
      if (m.date && isMatchPast(m)) return false;
      if (state.liveOnly && !isCurrentlyLive(m)) return false;
      if (state.sport !== 'all' && m.sport !== state.sport) return false;
      if (state.date !== 'all' && m.date !== state.date) return false;
      if (q && !(m.match+' '+m.competition+' '+ch+' '+m.sport).toLowerCase().includes(q)) return false;
      return true;
    })])
    .filter(([ch, ms]) => ms.length)
    .sort((a,b) => b[1].length - a[1].length);

  for (const [channel, matches] of entries) {
    shown++;
    const logo = getChannelLogo(channel);
    const streamUrl = getChannelUrl(channel);
    const initials = getInitials(channel);

    const channelEscaped = channel.replace(/'/g, "\\'");
    const logoEscaped = (logo || '').replace(/'/g, "\\'");

    const watchButton = streamUrl
      ? `<button class="watch-btn" onclick="event.stopPropagation(); openPlayer('${streamUrl}', '${channelEscaped}', '${logoEscaped}', '')" title="Regarder en direct">
           <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
           Direct
         </button>`
      : '';

    const logoHtml = logo
      ? `<img src="${logo}" class="channel-logo" onerror="this.outerHTML='<div class=\\'w-12 h-12 rounded-lg bg-gradient-to-br from-slate-600 to-slate-800 flex items-center justify-center text-white font-black text-sm shadow-sm flex-shrink-0\\'>${initials}</div>'">`
      : `<div class="w-12 h-12 rounded-lg bg-gradient-to-br from-slate-600 to-slate-800 flex items-center justify-center text-white font-black text-sm shadow-sm flex-shrink-0">${initials}</div>`;

    const byDate = {};
    matches.forEach(m => { const d = m.date || 'inconnue'; byDate[d] = byDate[d] || []; byDate[d].push(m); });
    const sortedDates = Object.keys(byDate).sort();

    let matchesHtml = '';
    sortedDates.forEach(date => {
      matchesHtml += `<div class="date-bar"><span class="date-label">${formatShortDate(date)}</span><span class="date-count">${byDate[date].length} programme${byDate[date].length>1?'s':''}</span></div>`;
      matchesHtml += byDate[date].map(m => {
        const isLive = isCurrentlyLive(m);
        const hasScore = m.score && m.score.trim() !== '';
        const hasLogos = m.home_logo || m.away_logo;

        const teams = m.match.split('–').map(t => t.trim());
        const homeName = teams[0] || m.match;
        const awayName = teams[1] || '';

        const matchData = encodeURIComponent(JSON.stringify(m));
        const channelData = encodeURIComponent(channel);

        return `
        <div class="match-row" data-match="${matchData}" data-channel="${channelData}">
          <div class="match-time">
            ${m.time}
            ${isLive ? '<span class="live-badge"><span class="live-dot w-1.5 h-1.5 rounded-full bg-red-500 mr-1"></span>DIRECT</span>' : ''}
          </div>
          <div class="flex-1 min-w-0">
            ${hasLogos ? `
              <div class="flex items-center gap-2 mb-1">
                ${m.home_logo ? `<img src="${m.home_logo}" class="w-5 h-5 object-contain rounded bg-white p-0.5 shadow-sm" onerror="this.style.display='none'">` : ''}
                <span class="font-semibold text-sm text-slate-900 truncate">${homeName}</span>
              </div>
              <div class="flex items-center gap-2">
                ${m.away_logo ? `<img src="${m.away_logo}" class="w-5 h-5 object-contain rounded bg-white p-0.5 shadow-sm" onerror="this.style.display='none'">` : ''}
                <span class="font-semibold text-sm text-slate-900 truncate">${awayName}</span>
              </div>
            ` : `
              <div class="match-sport">${emoji(m.sport)} ${m.sport}</div>
              <div class="match-title">${m.match}</div>
            `}
            ${hasScore ? `<div class="text-lg font-bold text-blue-600 mt-1 mono">${m.score}</div>` : ''}
            ${m.competition ? `<div class="text-[10px] text-slate-500 mt-1">${m.competition}</div>` : ''}
          </div>
        </div>`;
      }).join('');
    });

    html += `
    <div class="channel-card fade-up" style="animation-delay:${Math.min(idx*.05,.3)}s">
      <div class="channel-header">
        <div class="flex items-center gap-3 flex-1 min-w-0">
          ${logoHtml}
          <div class="flex-1 min-w-0">
            <div class="channel-name truncate">${channel}</div>
            <div class="channel-count">${matches.length} programme${matches.length>1?'s':''}</div>
          </div>
        </div>
        ${watchButton}
      </div>
      <div>${matchesHtml}</div>
    </div>`;
    idx++;
  }

  container.innerHTML = html;
  document.getElementById('empty').classList.toggle('hidden', shown > 0);

  container.querySelectorAll('.match-row').forEach(row => {
    row.addEventListener('click', () => {
      try {
        const match = JSON.parse(decodeURIComponent(row.dataset.match));
        const channel = decodeURIComponent(row.dataset.channel);
        openModal(match, channel);
      } catch(e) { console.error('Erreur modal:', e); }
    });
  });
}

function render() {
  buildLiveIndex(); // ✅ reconstruit l'index des horaires avant tout rendu
  renderSelectors(); renderLive(); renderChannels();
  const d = new Date(DATA.updated_at);
  document.getElementById('update-text').textContent =
    `MàJ ${d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}`;
}

async function load() {
  try {
    const r = await fetch('data/schedule.json?t=' + Date.now());
    if (!r.ok) throw new Error();
    DATA = await r.json();

    try {
      const gistUrl = 'https://gist.githubusercontent.com/mikefri/5f10333ea977f5851f0506827fb1243b/raw/channel2.json';
      const ch = await fetch(gistUrl + '?t=' + Date.now());
      if (ch.ok) {
        CHANNELS_DATA = await ch.json();
        console.log(`✅ Logos et URLs chargés depuis GitHub Gist : ${CHANNELS_DATA.length} chaînes`);
      } else {
        throw new Error('Gist non accessible');
      }
    } catch(e) {
      console.warn('️ Impossible de charger channel2.json depuis le Gist:', e);
    }

    render();
  } catch(e) {
    document.getElementById('channels').innerHTML =
      `<div class="col-span-full bg-white rounded-xl border border-red-200 p-8 text-center text-red-600">
         Impossible de charger <code>data/schedule.json</code>. Lancez le workflow GitHub Actions.
       </div>`;
  }
}

document.querySelectorAll('.nav-pill[data-sport]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-pill[data-sport]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.sport = btn.dataset.sport;
    renderChannels();
  });
});

const toggleLive = () => {
  state.liveOnly = !state.liveOnly;
  document.querySelectorAll('.nav-pill.live').forEach(b => {
    b.style.background = state.liveOnly ? '#b91c1c' : '';
    b.style.borderColor = state.liveOnly ? '#b91c1c' : '';
  });
  renderChannels();
};
document.getElementById('nav-live')?.addEventListener('click', toggleLive);
document.getElementById('nav-live-mobile')?.addEventListener('click', toggleLive);

document.getElementById('date-select').addEventListener('change', e => { state.date = e.target.value; renderChannels(); });
document.getElementById('channel-select').addEventListener('change', e => { state.channel = e.target.value; renderChannels(); });
document.getElementById('search').addEventListener('input', e => { state.search = e.target.value; renderChannels(); });

document.getElementById('mobile-menu-btn')?.addEventListener('click', () => {
  const nav = document.getElementById('mobile-nav');
  nav.classList.toggle('hidden');
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
   navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('Service Worker enregistré', reg))
      .catch(err => console.log('Erreur Service Worker', err));
  });
}

let deferredPrompt;
const installBanner = document.getElementById('install-banner');
const installBtn = document.getElementById('install-btn');
const dismissBtn = document.getElementById('dismiss-install');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBanner.classList.add('show');
});

installBtn.addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBanner.classList.remove('show');
  }
});

dismissBtn.addEventListener('click', () => {
  installBanner.classList.remove('show');
});

window.addEventListener('appinstalled', () => {
  installBanner.classList.remove('show');
  deferredPrompt = null;
});

load();
setInterval(load, 10 * 60 * 1000);

// ✅ NOUVEAU : rafraîchit le statut "direct" toutes les 60 secondes (sans recharger les données)
setInterval(() => {
  if (DATA) { renderLive(); }
}, 60 * 1000);
</script>
</body>
</html>
